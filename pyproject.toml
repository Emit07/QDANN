[project]
name = "qdann"
version = "0.1.0"
description = "Clean-room reimplementation of QDANN (Ma et al., RSE 2024) for subfield crop yield mapping"
readme = "README.md"
authors = [
    { name = "emit07", email = "emit07@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "earthengine-api>=1.7.41",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "planetary-computer>=1.0.0",
    "pyarrow>=25.0.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.1",
    "scikit-learn>=1.7.2",
    "shapely>=2.1.2",
    "torch==2.9.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
